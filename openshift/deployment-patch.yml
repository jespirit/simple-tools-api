spec:
  template:
    spec:
      containers:
        - name: simple-tools-api # <-- IMPORTANT: Use the name of your application
          ports:
            - containerPort: 8080
              protocol: TCP
          # =============================================================
          # THIS IS THE SECTION YOU NEED TO ADD/MODIFY
          # It tells the container to load environment variables from a source.
          # =============================================================
          envFrom:
            - configMapRef:
                # This must match the metadata.name in your app-config.yml
                name: simple-tools-api-config