# GitHub Action for building and deploying a .NET API to OpenShift
name: Build and Deploy to OpenShift

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------------------------
      # NEW STEP: Install the OpenShift CLI on the runner
      # This must come before any steps that use the 'oc' command.
      # -------------------------------------------------------------------
      - name: Install oc CLI
        uses: redhat-actions/oc-installer@v1

      # 1. Logs into openshift
      - name: Log in to Openshift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          insecure_skip_tls_verify: true # Use this for developer sandboxes with self-signed certs
          namespace: ${{ secrets.OPENSHIFT_PROJECT }}

      # NEW STEP: Apply environment variables to the BuildConfig
      - name: Apply Build Configuration
        run: oc patch buildconfig simple-tools-api --patch-file buildconfig-patch.yml

      # NEW STEP: Apply environment variables to the Deployment
      - name: Apply Deployment Configuration
        run: oc patch deployment simple-tools-api --patch-file deployment-patch.yml

      # 2. Starts a new binary build from the latest code
      - name: Start openshift build
        run: |
          oc start-build simple-tools-api --from-dir=. --follow
          
      # -------------------------------------------------------------------
      # CORRECTED STEP: Use 'rollout restart' for a 'Deployment'
      # The resource is 'deployment/' (or the short name 'deploy/') not 'dc/'.
      # -------------------------------------------------------------------
      - name: Trigger new deployment rollout
        run: oc rollout restart deployment/simple-tools-api

      # 4. Logs out of Openshift
      - name: Log out of Openshift
        if: always()
        run: oc logout
